<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>You're invited on topo</title>

<!--
  These are what make a shared link render as a card in Messages, WhatsApp and
  everywhere else, instead of as a line of blue text. A link crawler fetches
  this page and reads them; it does not run the script below, so whatever the
  script discovers about the event can never reach the preview. Putting the
  event's own name in the card needs the tags themselves rendered per event,
  which a static host cannot do.
-->
<meta property="og:type" content="website">
<meta property="og:title" content="You're invited on topo">
<meta property="og:description" content="Tap to see the event, who's going, and who you'd want to meet.">
<meta property="og:url" content="https://www.jointopo.app/event">
<meta property="og:image" content="https://www.jointopo.app/preview.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="You're invited on topo">
<meta name="twitter:description" content="Tap to see the event, who's going, and who you'd want to meet.">
<meta name="twitter:image" content="https://www.jointopo.app/preview.png">

<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 5rem 1.25rem 4rem;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #0f172a;
    background: #f8fafc;
    text-align: center;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 26rem; margin: 0 auto; }
  h1 {
    font-size: 2.8rem; margin: 0 0 1.5rem; letter-spacing: -.03em;
    background: linear-gradient(90deg, #10b981, #06b6d4);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lead { font-size: 1.25rem; font-weight: 700; margin: 0 0 .5rem; }
  .when { color: #475569; margin: 0 0 1.75rem; }
  .btn {
    display: block; padding: .9rem 1rem; border-radius: 999px; margin: 0 0 .75rem;
    background: linear-gradient(90deg, #10b981, #0ea5e9); color: #fff;
    font-weight: 800; text-decoration: none;
  }
  .btn.plain { background: none; color: #0f172a; border: 1px solid #cbd5e1; }
  .muted { color: #64748b; font-size: .95rem; margin: 1.5rem 0 0; }
  .code { margin-top: 2rem; font-size: .85rem; color: #64748b; }
  .code strong { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; color: #0f172a; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f172a; color: #e2e8f0; }
    .when { color: #94a3b8; }
    .btn.plain { color: #e2e8f0; border-color: #334155; }
    .code strong { color: #e2e8f0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>topo</h1>
  <p class="lead" id="lead">You're invited to an event.</p>
  <p class="when" id="when" hidden></p>
  <a class="btn" id="open" href="#">Open in topo</a>
  <a class="btn plain" id="store" href="#" hidden>Get topo</a>
  <p class="muted" id="how">New to topo? Get the app, then tap this link again to join the event.</p>
  <p class="code">Event code <strong id="code">&mdash;</strong></p>
</div>
<script>
(function () {
  var APP_STORE_URL = 'https://apps.apple.com/app/id6801630953';
  var SUPABASE_URL = 'https://nhsiaqibsmxzczpoiacj.supabase.co';
  var ANON_KEY = 'sb_publishable_CCrr3TPmfatNVqJnzcne-Q_1ehoBCab';

  var params = new URLSearchParams(location.search);
  var code = (params.get('c') || '').replace(/[^A-Za-z0-9-]/g, '').toUpperCase();
  var lead = document.getElementById('lead');
  var open = document.getElementById('open');

  if (!code) {
    lead.textContent = 'This event link is missing its code.';
    open.hidden = true;
    document.getElementById('how').hidden = true;
    return;
  }

  var appLink = 'topoapp://event/' + code;
  document.getElementById('code').textContent = code;
  open.href = appLink;

  var store = document.getElementById('store');
  store.href = APP_STORE_URL;
  store.hidden = false;

  // What the event is, so the page is not a mystery to someone deciding
  // whether to install an app for it. Public by design: the code is the
  // secret, and anyone holding it was sent it. Never who is going.
  fetch(SUPABASE_URL + '/rest/v1/rpc/event_preview', {
    method: 'POST',
    headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: code })
  })
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (rows) {
      var row = Array.isArray(rows) ? rows[0] : rows;
      if (!row || !row.name) return;
      lead.textContent = "You're invited to " + row.name + '.';
      document.title = row.name + ' · topo';

      var bits = [];
      if (row.starts_at) {
        var d = new Date(row.starts_at);
        if (!isNaN(d.getTime())) {
          bits.push(d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }));
          bits.push(d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }));
        }
      }
      if (row.location) bits.push(row.location);
      if (bits.length) {
        var when = document.getElementById('when');
        when.textContent = bits.join(' · ');
        when.hidden = false;
      }
    })
    .catch(function () {});

  // Opens topo straight away if it is installed. Someone without it stays here
  // and sees the Get topo button instead of a dead end.
  setTimeout(function () { location.href = appLink; }, 500);
})();
</script>
</body>
</html>
