<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Join me on topo</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 5rem 1.25rem 4rem;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #0f172a;
    background: #f8fafc;
    text-align: center;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 26rem; margin: 0 auto; }
  h1 {
    font-size: 2.8rem; margin: 0 0 1.5rem; letter-spacing: -.03em;
    background: linear-gradient(90deg, #10b981, #06b6d4);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lead { font-size: 1.25rem; font-weight: 700; margin: 0 0 1.75rem; }
  .btn {
    display: block; padding: .9rem 1rem; border-radius: 999px; margin: 0 0 .75rem;
    background: linear-gradient(90deg, #10b981, #0ea5e9); color: #fff;
    font-weight: 800; text-decoration: none;
  }
  .btn.plain { background: none; color: #0f172a; border: 1px solid #cbd5e1; }
  .muted { color: #64748b; font-size: .95rem; margin: 1.5rem 0 0; }
  .code { margin-top: 2rem; font-size: .85rem; color: #64748b; }
  .code strong { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; color: #0f172a; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f172a; color: #e2e8f0; }
    .btn.plain { color: #e2e8f0; border-color: #334155; }
    .code strong { color: #e2e8f0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>topo</h1>
  <p class="lead" id="lead">You've been invited to topo.</p>
  <a class="btn" id="open" href="#">Open in topo</a>
  <a class="btn plain" id="store" href="#" hidden>Get topo</a>
  <p class="muted" id="how">New to topo? Get the app and sign up, then come back and tap this link again. You'll be connected straight away.</p>
  <p class="code">Invite code <strong id="code">—</strong></p>
</div>
<script>
(function () {
  // Fill in once topo is on the App Store; the button stays hidden until then.
  var APP_STORE_URL = '';
  var SUPABASE_URL = 'https://nhsiaqibsmxzczpoiacj.supabase.co';
  var ANON_KEY = 'sb_publishable_CCrr3TPmfatNVqJnzcne-Q_1ehoBCab';

  var params = new URLSearchParams(location.search);
  var code = (params.get('c') || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  var lead = document.getElementById('lead');
  var open = document.getElementById('open');

  if (!code) {
    lead.textContent = 'This invite link is missing its code.';
    open.hidden = true;
    document.getElementById('how').hidden = true;
    return;
  }

  var appLink = 'topoapp://invite/' + code;
  document.getElementById('code').textContent = code;
  open.href = appLink;
  if (APP_STORE_URL) {
    var store = document.getElementById('store');
    store.href = APP_STORE_URL;
    store.hidden = false;
  }

  // Who sent it, first name only.
  fetch(SUPABASE_URL + '/rest/v1/rpc/invite_preview', {
    method: 'POST',
    headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: code })
  })
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (rows) {
      var row = Array.isArray(rows) ? rows[0] : rows;
      if (row && row.first_name) lead.textContent = row.first_name + ' invited you to topo.';
    })
    .catch(function () {});

  // Opens topo straight away if it's installed.
  setTimeout(function () { location.href = appLink; }, 500);
})();
</script>
</body>
</html>
